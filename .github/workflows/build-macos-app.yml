name: SYDownload CI / Release

on:
  push:
    branches:
      - main
    paths:
      - Sources/**
      - Tests/**
      - Bridge/**
      - script/**
      - Package.swift
      - Package.resolved
      - VERSION
      - .github/workflows/build-macos-app.yml
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create the v<VERSION> GitHub Release if it does not exist"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sydownload-ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package SYDownload
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use semantic versioning, for example 0.3.3. Got: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($TAG)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine release intent
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_PUBLISH=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            SHOULD_PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            SHOULD_PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              SHOULD_PUBLISH=true
            fi
          fi

          if [[ "$SHOULD_PUBLISH" == "true" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
              if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
                echo "Tag $TAG already points to $TAG_COMMIT instead of $GITHUB_SHA." >&2
                exit 1
              fi
            fi

            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists; SYDownload releases are immutable." >&2
              exit 1
            fi
          fi

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          uname -m
          swift --version
          python3 --version
          xcodebuild -version

      - name: Swift tests
        run: swift test

      - name: Python bridge tests
        run: python3 -m unittest discover -s Bridge/tests -p 'test_*.py'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            script/bundle_runtime.sh
            .github/workflows/build-macos-app.yml

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Build self-contained app
        env:
          CONFIGURATION: release
          APP_VERSION: ${{ steps.version.outputs.version }}
          ADHOC_SIGN: 1
          BUNDLE_RUNTIME: 1
          PYTHON_VERSION: "3.12"
          XHS_REVISION: cc7c78088afc09082f54ea6263a9fd07c2fa510f
          DOUK_REVISION: 43e1abc4ab401b31560423450d01648e83c9b48a
        run: |
          chmod +x script/*.sh
          ./script/package_app.sh

      - name: Verify app bundle and embedded runtime
        env:
          SYDOWNLOAD_APP_SUPPORT: ${{ runner.temp }}/SYDownload-AppSupport
          SYDOWNLOAD_CACHE: ${{ runner.temp }}/SYDownload-Cache
          PYTHONDONTWRITEBYTECODE: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP="dist/SYDownload.app"
          PYTHON="$APP/Contents/Resources/python/bin/python3"
          BRIDGE="$APP/Contents/Resources/bridge/engine_bridge.py"

          file "$APP/Contents/MacOS/SYDownload"
          "$PYTHON" --version
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"

          test -x "$PYTHON"
          test -f "$APP/Contents/Resources/bridge/download_runtime.py"
          test -f "$APP/Contents/Resources/SYDownloadIcon.png"
          test -f "$APP/Contents/Resources/XiaohongshuPlatformIcon.jpg"
          test -f "$APP/Contents/Resources/DouyinPlatformIcon.jpg"
          test ! -e "$APP/SYDownload_SYDownloadApp.bundle"
          test ! -e "$APP/Contents/Resources/SYDownload_SYDownloadApp.bundle"
          test -f "$APP/Contents/Resources/engines/XHS-Downloader/main.py"
          test -f "$APP/Contents/Resources/engines/TikTokDownloader/main.py"
          test -f "$APP/Contents/Resources/engine-manifest.json"
          test -z "$(find "$APP" -type l -print -quit)"

          PING="$(printf '%s\n' '{"id":"00000000-0000-0000-0000-000000000001","command":"ping"}' | "$PYTHON" -B "$BRIDGE" --once)"
          echo "$PING"
          echo "$PING" | grep -q '"ok": true'

          VALIDATE="$(printf '%s\n' '{"id":"00000000-0000-0000-0000-000000000002","command":"validate","url":"https://xhslink.com/ci-smoke-test"}' | "$PYTHON" -B "$BRIDGE" --once)"
          echo "$VALIDATE"
          echo "$VALIDATE" | grep -q '"ok": true'
          test -f "$SYDOWNLOAD_APP_SUPPORT/engines/XHS-Downloader/cc7c78088afc09082f54ea6263a9fd07c2fa510f/main.py"

      - name: Installed-app launch smoke test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          APP="$PWD/dist/SYDownload.app"
          /usr/bin/open -n "$APP"

          PID=""
          for attempt in {1..10}; do
            PID="$(/usr/bin/pgrep -x SYDownload | /usr/bin/head -n 1 || true)"
            if [[ -n "$PID" ]]; then
              break
            fi
            sleep 1
          done

          if [[ -z "$PID" ]]; then
            echo "SYDownload failed to stay alive during startup."
            exit 1
          fi

          sleep 5
          if ! /bin/kill -0 "$PID" 2>/dev/null; then
            echo "SYDownload crashed during installed-app startup smoke test."
            exit 1
          fi

          /bin/kill "$PID" || true

      - name: Reseal app after smoke tests
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/dist/SYDownload.app"
          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Package ZIP, DMG, and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP="$PWD/dist/SYDownload.app"
          RELEASE_DIR="$RUNNER_TEMP/release"
          CI_ARTIFACT_DIR="$RUNNER_TEMP/ci-artifact"

          test -d "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"
          rm -rf "$RELEASE_DIR" "$CI_ARTIFACT_DIR"
          mkdir -p "$RELEASE_DIR" "$CI_ARTIFACT_DIR"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RELEASE_DIR/SYDownload.zip"

          script/build_dmg.sh "$APP" "$VERSION" "$RELEASE_DIR"

          (
            cd "$RELEASE_DIR"
            shasum -a 256 SYDownload.zip "SYDownload-$VERSION.dmg" > SHA256SUMS
          )

          ditto "$APP" "$CI_ARTIFACT_DIR/SYDownload.app"
          cp "$RELEASE_DIR/SYDownload-$VERSION.dmg" "$CI_ARTIFACT_DIR/"

      - name: Verify release packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/release"
          ZIP="$RELEASE_DIR/SYDownload.zip"
          DMG="$RELEASE_DIR/SYDownload-$VERSION.dmg"
          ZIP_EXTRACT="$RUNNER_TEMP/zip-verify"
          DMG_MOUNT="$RUNNER_TEMP/dmg-mount"

          test -s "$ZIP"
          test -s "$DMG"
          test -s "$RELEASE_DIR/SHA256SUMS"

          rm -rf "$ZIP_EXTRACT" "$DMG_MOUNT"
          mkdir -p "$ZIP_EXTRACT" "$DMG_MOUNT"
          ditto -xk "$ZIP" "$ZIP_EXTRACT"
          test -d "$ZIP_EXTRACT/SYDownload.app"
          test ! -f "$ZIP_EXTRACT/SYDownload.zip"
          codesign --verify --deep --strict --verbose=4 "$ZIP_EXTRACT/SYDownload.app"

          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$DMG_MOUNT"
          trap 'hdiutil detach "$DMG_MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$DMG_MOUNT/SYDownload.app"
          test -L "$DMG_MOUNT/Applications"
          test -x "$DMG_MOUNT/Install.command"
          codesign --verify --deep --strict --verbose=4 "$DMG_MOUNT/SYDownload.app"
          hdiutil detach "$DMG_MOUNT"
          trap - EXIT

          (
            cd "$RELEASE_DIR"
            shasum -a 256 -c SHA256SUMS
          )

      - name: Upload CI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SYDownload-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/ci-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Create release tag
        if: steps.release.outputs.should_publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish immutable GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SYDownload ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ runner.temp }}/release/SYDownload.zip
            ${{ runner.temp }}/release/SYDownload-${{ steps.version.outputs.version }}.dmg
            ${{ runner.temp }}/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
