name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Bridge/**
      - script/**
      - .github/workflows/build-macos-app.yml

permissions:
  contents: read

concurrency:
  group: sydownload-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          uname -m
          swift --version
          python3 --version
          xcodebuild -version

      - name: Swift tests
        run: swift test

      - name: Python bridge tests
        run: python3 -m unittest discover -s Bridge/tests -p 'test_*.py'

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
            artifact: SYDownload-macOS-AppleSilicon
          - runner: macos-15-intel
            arch: Intel
            artifact: SYDownload-macOS-Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Toolchain
        run: |
          uname -m
          swift --version
          uv --version
          xcodebuild -version

      - name: Build self-contained app
        env:
          CONFIGURATION: release
          APP_VERSION: 0.2.${{ github.run_number }}
          ADHOC_SIGN: 1
          BUNDLE_RUNTIME: 1
          PYTHON_VERSION: "3.12"
          XHS_REVISION: cc7c78088afc09082f54ea6263a9fd07c2fa510f
          DOUK_REVISION: 43e1abc4ab401b31560423450d01648e83c9b48a
        run: |
          chmod +x script/*.sh
          ./script/package_app.sh

      - name: Verify app bundle and embedded runtime
        env:
          SYDOWNLOAD_APP_SUPPORT: ${{ runner.temp }}/SYDownload-AppSupport
          SYDOWNLOAD_CACHE: ${{ runner.temp }}/SYDownload-Cache
        run: |
          APP="dist/SYDownload.app"
          PYTHON="$APP/Contents/Resources/python/bin/python3"
          BRIDGE="$APP/Contents/Resources/bridge/engine_bridge.py"

          file "$APP/Contents/MacOS/SYDownload"
          "$PYTHON" --version
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"

          test -x "$PYTHON"
          test -f "$APP/Contents/Resources/engines/XHS-Downloader/main.py"
          test -f "$APP/Contents/Resources/engines/TikTokDownloader/main.py"
          test -f "$APP/Contents/Resources/engine-manifest.json"
          test -z "$(find "$APP/Contents" -type l -print -quit)"

          PING="$(printf '%s\n' '{"id":"00000000-0000-0000-0000-000000000001","command":"ping"}' | "$PYTHON" "$BRIDGE" --once)"
          echo "$PING"
          echo "$PING" | grep -q '"ok": true'

          VALIDATE="$(printf '%s\n' '{"id":"00000000-0000-0000-0000-000000000002","command":"validate","url":"https://xhslink.com/ci-smoke-test"}' | "$PYTHON" "$BRIDGE" --once)"
          echo "$VALIDATE"
          echo "$VALIDATE" | grep -q '"ok": true'
          test -f "$SYDOWNLOAD_APP_SUPPORT/engines/XHS-Downloader/cc7c78088afc09082f54ea6263a9fd07c2fa510f/main.py"

      - name: Launch smoke test
        run: |
          APP="$PWD/dist/SYDownload.app"
          /usr/bin/open -n "$APP"

          PID=""
          for attempt in {1..10}; do
            PID="$(/usr/bin/pgrep -x SYDownload | /usr/bin/head -n 1 || true)"
            if [[ -n "$PID" ]]; then
              break
            fi
            sleep 1
          done

          if [[ -z "$PID" ]]; then
            echo "SYDownload failed to stay alive during startup."
            exit 1
          fi

          sleep 2
          if ! /bin/kill -0 "$PID" 2>/dev/null; then
            echo "SYDownload crashed during startup smoke test."
            exit 1
          fi

          /bin/kill "$PID" || true

      - name: Archive app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent SYDownload.app "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
